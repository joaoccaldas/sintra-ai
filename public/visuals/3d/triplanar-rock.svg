<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Evaluate triplanar projection for rock faces — procedure diagram</title><desc id="desc">A scaled boulder, a licensed rock texture and a 1 m mapping reference. Compare the existing UV mapping with an object/world-space projection study. Control blend sharpness around corners and inspect rotated and non-uniformly scaled copies. Bake to a portable UV texture only when the destination cannot reproduce the shader</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / MATERIALS &amp; LIGHTING</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Evaluate triplanar projection for rock faces</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A scaled boulder, a licensed rock texture and a 1 m mapping reference</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Compare the existing UV</text><text x="54" y="360" font-size="18" fill="#efedf6">mapping with an</text><text x="54" y="386" font-size="18" fill="#efedf6">object/world-space</text><text x="54" y="412" font-size="18" fill="#efedf6">projection study</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Control blend sharpness</text><text x="356" y="360" font-size="18" fill="#efedf6">around corners and</text><text x="356" y="386" font-size="18" fill="#efedf6">inspect rotated and non-</text><text x="356" y="412" font-size="18" fill="#efedf6">uniformly scaled copies</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Bake to a portable UV</text><text x="658" y="360" font-size="18" fill="#efedf6">texture only when the</text><text x="658" y="386" font-size="18" fill="#efedf6">destination cannot</text><text x="658" y="412" font-size="18" fill="#efedf6">reproduce the shader</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>