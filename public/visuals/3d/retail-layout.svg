<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Compare shelf layouts with product proxies — procedure diagram</title><desc id="desc">A 10 by 8 m shop, four shelves and a marked circulation route. Reuse approved shelf and product proxies; place from a layout table. Keep aisle envelopes visible as separate non-rendered guides. Compare two layouts from entry and cashier viewpoints, then walk the route</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / ARCHITECTURE &amp; PRODUCTS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Compare shelf layouts with product proxies</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A 10 by 8 m shop, four shelves and a marked circulation route</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Reuse approved shelf and</text><text x="54" y="360" font-size="18" fill="#efedf6">product proxies; place</text><text x="54" y="386" font-size="18" fill="#efedf6">from a layout table</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Keep aisle envelopes</text><text x="356" y="360" font-size="18" fill="#efedf6">visible as separate non-</text><text x="356" y="386" font-size="18" fill="#efedf6">rendered guides</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Compare two layouts from</text><text x="658" y="360" font-size="18" fill="#efedf6">entry and cashier</text><text x="658" y="386" font-size="18" fill="#efedf6">viewpoints, then walk the</text><text x="658" y="412" font-size="18" fill="#efedf6">route</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>