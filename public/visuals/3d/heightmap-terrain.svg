<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Turn a heightmap into a bounded landscape — procedure diagram</title><desc id="desc">A licensed 256 by 256 grayscale heightmap, a 100 m square and a 12 m height range. Subdivide a plane at an agreed preview density and map image intensity to Z displacement. Keep the source image and height mapping explicit; inspect flat black and white sample pixels. Create a lower-detail preview and compare ridge positions against the original image</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / WORLDS &amp; ENVIRONMENTS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Turn a heightmap into a bounded landscape</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A licensed 256 by 256 grayscale heightmap, a 100 m square and a 12 m</text><text x="36" y="191" font-size="18" fill="#bdb8d0">height range</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Subdivide a plane at an</text><text x="54" y="360" font-size="18" fill="#efedf6">agreed preview density</text><text x="54" y="386" font-size="18" fill="#efedf6">and map image intensity</text><text x="54" y="412" font-size="18" fill="#efedf6">to Z displacement</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Keep the source image and</text><text x="356" y="360" font-size="18" fill="#efedf6">height mapping explicit;</text><text x="356" y="386" font-size="18" fill="#efedf6">inspect flat black and</text><text x="356" y="412" font-size="18" fill="#efedf6">white sample pixels</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Create a lower-detail</text><text x="658" y="360" font-size="18" fill="#efedf6">preview and compare ridge</text><text x="658" y="386" font-size="18" fill="#efedf6">positions against the</text><text x="658" y="412" font-size="18" fill="#efedf6">original image</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>