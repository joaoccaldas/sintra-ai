<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Build a reusable oak material study — procedure diagram</title><desc id="desc">One neutral plinth, a licensed oak texture and 0.6 m real-world mapping width. Apply base color and separate roughness/normal inputs with the correct data interpretation. Compare restrained normal strength against a flat baseline under the same key light. Check end grain, seams and mapping scale before accepting the finish for a room</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / MATERIALS &amp; LIGHTING</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Build a reusable oak material study</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One neutral plinth, a licensed oak texture and 0.6 m real-world mapping</text><text x="36" y="191" font-size="18" fill="#bdb8d0">width</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Apply base color and</text><text x="54" y="360" font-size="18" fill="#efedf6">separate roughness/normal</text><text x="54" y="386" font-size="18" fill="#efedf6">inputs with the correct</text><text x="54" y="412" font-size="18" fill="#efedf6">data interpretation</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Compare restrained normal</text><text x="356" y="360" font-size="18" fill="#efedf6">strength against a flat</text><text x="356" y="386" font-size="18" fill="#efedf6">baseline under the same</text><text x="356" y="412" font-size="18" fill="#efedf6">key light</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Check end grain, seams</text><text x="658" y="360" font-size="18" fill="#efedf6">and mapping scale before</text><text x="658" y="386" font-size="18" fill="#efedf6">accepting the finish for</text><text x="658" y="412" font-size="18" fill="#efedf6">a room</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>