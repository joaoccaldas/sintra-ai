<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Walk through an existing room in VR — procedure diagram</title><desc id="desc">One reviewed room, two controller inputs and an XR-capable device. Reuse the room&#x27;s loader and enable the renderer&#x27;s supported XR session path. Define a bounded locomotion mode and inspect floor scale before entering the headset. Test entry, recenter, exit and a non-XR fallback on the physical device</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / WEB, XR &amp; INTERACTION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Walk through an existing room in VR</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One reviewed room, two controller inputs and an XR-capable device</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Reuse the room&#x27;s loader</text><text x="54" y="360" font-size="18" fill="#efedf6">and enable the renderer&#x27;s</text><text x="54" y="386" font-size="18" fill="#efedf6">supported XR session path</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Define a bounded</text><text x="356" y="360" font-size="18" fill="#efedf6">locomotion mode and</text><text x="356" y="386" font-size="18" fill="#efedf6">inspect floor scale</text><text x="356" y="412" font-size="18" fill="#efedf6">before entering the</text><text x="356" y="438" font-size="18" fill="#efedf6">headset</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Test entry, recenter,</text><text x="658" y="360" font-size="18" fill="#efedf6">exit and a non-XR</text><text x="658" y="386" font-size="18" fill="#efedf6">fallback on the physical</text><text x="658" y="412" font-size="18" fill="#efedf6">device</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>