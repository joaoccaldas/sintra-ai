<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Visualize Solar System positions from ephemerides — procedure diagram</title><desc id="desc">Sun, Earth and Mars vectors for one named UTC interval with an explicit center/frame. Choose the Horizons vector output, target IDs, center, reference frame and time scale deliberately. Save the original query/result and convert distance/time units in a separate transformation table. Animate the sampled positions in Blender or a web viewer with distance and radius scale factors labelled</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / SPACE &amp; SCIENTIFIC DATA</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Visualize Solar System positions from ephemerides</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: Sun, Earth and Mars vectors for one named UTC interval with an explicit</text><text x="36" y="191" font-size="18" fill="#bdb8d0">center/frame</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Choose the Horizons</text><text x="54" y="360" font-size="18" fill="#efedf6">vector output, target</text><text x="54" y="386" font-size="18" fill="#efedf6">IDs, center, reference</text><text x="54" y="412" font-size="18" fill="#efedf6">frame and time scale</text><text x="54" y="438" font-size="18" fill="#efedf6">deliberately</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Save the original</text><text x="356" y="360" font-size="18" fill="#efedf6">query/result and convert</text><text x="356" y="386" font-size="18" fill="#efedf6">distance/time units in a</text><text x="356" y="412" font-size="18" fill="#efedf6">separate transformation</text><text x="356" y="438" font-size="18" fill="#efedf6">table</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Animate the sampled</text><text x="658" y="360" font-size="18" fill="#efedf6">positions in Blender or a</text><text x="658" y="386" font-size="18" fill="#efedf6">web viewer with distance</text><text x="658" y="412" font-size="18" fill="#efedf6">and radius scale factors</text><text x="658" y="438" font-size="18" fill="#efedf6">labelled</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>