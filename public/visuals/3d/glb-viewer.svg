<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Load a reviewed GLB in an existing web viewer — procedure diagram</title><desc id="desc">One self-contained licensed GLB and the project&#x27;s existing Three.js loader. Inspect the current viewer and reuse its GLTFLoader/decoder setup. Load the model with an error state and fit the camera to its bounds. Check scale, materials and animation in the actual deployed base path; dispose owned resources on replacement</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / WEB, XR &amp; INTERACTION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Load a reviewed GLB in an existing web viewer</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One self-contained licensed GLB and the project&#x27;s existing Three.js</text><text x="36" y="191" font-size="18" fill="#bdb8d0">loader</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Inspect the current</text><text x="54" y="360" font-size="18" fill="#efedf6">viewer and reuse its</text><text x="54" y="386" font-size="18" fill="#efedf6">GLTFLoader/decoder setup</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Load the model with an</text><text x="356" y="360" font-size="18" fill="#efedf6">error state and fit the</text><text x="356" y="386" font-size="18" fill="#efedf6">camera to its bounds</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Check scale, materials</text><text x="658" y="360" font-size="18" fill="#efedf6">and animation in the</text><text x="658" y="386" font-size="18" fill="#efedf6">actual deployed base</text><text x="658" y="412" font-size="18" fill="#efedf6">path; dispose owned</text><text x="658" y="438" font-size="18" fill="#efedf6">resources on replacement</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>