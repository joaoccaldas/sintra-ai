<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Compare three prop LODs — procedure diagram</title><desc id="desc">One decorative statue and 100%, 50%, 20% geometry candidates. Preserve the master and derive two decimation candidates with recorded settings. Compare silhouettes at 1 m, 5 m and 15 m using identical camera and lighting. Configure engine LOD transitions and measure the complete scene on the target device</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / GAME ASSETS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Compare three prop LODs</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One decorative statue and 100%, 50%, 20% geometry candidates</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Preserve the master and</text><text x="54" y="360" font-size="18" fill="#efedf6">derive two decimation</text><text x="54" y="386" font-size="18" fill="#efedf6">candidates with recorded</text><text x="54" y="412" font-size="18" fill="#efedf6">settings</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Compare silhouettes at 1</text><text x="356" y="360" font-size="18" fill="#efedf6">m, 5 m and 15 m using</text><text x="356" y="386" font-size="18" fill="#efedf6">identical camera and</text><text x="356" y="412" font-size="18" fill="#efedf6">lighting</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Configure engine LOD</text><text x="658" y="360" font-size="18" fill="#efedf6">transitions and measure</text><text x="658" y="386" font-size="18" fill="#efedf6">the complete scene on the</text><text x="658" y="412" font-size="18" fill="#efedf6">target device</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>