<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Build a rotating collectible with inspection — procedure diagram</title><desc id="desc">One collectible mesh, an inspection camera and a 0.3 m interaction radius. Export the object with a centered inspection pivot and a separate collision proxy. Implement a pickup state that hides the world object and shows its inspection instance. Rotate the inspection instance with bounded input and restore focus on close</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / GAME ASSETS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Build a rotating collectible with inspection</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One collectible mesh, an inspection camera and a 0.3 m interaction</text><text x="36" y="191" font-size="18" fill="#bdb8d0">radius</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Export the object with a</text><text x="54" y="360" font-size="18" fill="#efedf6">centered inspection pivot</text><text x="54" y="386" font-size="18" fill="#efedf6">and a separate collision</text><text x="54" y="412" font-size="18" fill="#efedf6">proxy</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Implement a pickup state</text><text x="356" y="360" font-size="18" fill="#efedf6">that hides the world</text><text x="356" y="386" font-size="18" fill="#efedf6">object and shows its</text><text x="356" y="412" font-size="18" fill="#efedf6">inspection instance</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Rotate the inspection</text><text x="658" y="360" font-size="18" fill="#efedf6">instance with bounded</text><text x="658" y="386" font-size="18" fill="#efedf6">input and restore focus</text><text x="658" y="412" font-size="18" fill="#efedf6">on close</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>