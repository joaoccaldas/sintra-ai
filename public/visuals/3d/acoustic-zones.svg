<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Visualize an acoustic planning hypothesis — procedure diagram</title><desc id="desc">A room, two speaker markers and hand-authored quiet/focus zones. Import the existing room and label the zones as planning assumptions. Draw colored bounded volumes and source markers without claiming computed sound fields. Compare furniture alternatives and export a legend plus the unresolved acoustic questions</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / ARCHITECTURE &amp; PRODUCTS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Visualize an acoustic planning hypothesis</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A room, two speaker markers and hand-authored quiet/focus zones</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Import the existing room</text><text x="54" y="360" font-size="18" fill="#efedf6">and label the zones as</text><text x="54" y="386" font-size="18" fill="#efedf6">planning assumptions</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Draw colored bounded</text><text x="356" y="360" font-size="18" fill="#efedf6">volumes and source</text><text x="356" y="386" font-size="18" fill="#efedf6">markers without claiming</text><text x="356" y="412" font-size="18" fill="#efedf6">computed sound fields</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Compare furniture</text><text x="658" y="360" font-size="18" fill="#efedf6">alternatives and export a</text><text x="658" y="386" font-size="18" fill="#efedf6">legend plus the</text><text x="658" y="412" font-size="18" fill="#efedf6">unresolved acoustic</text><text x="658" y="438" font-size="18" fill="#efedf6">questions</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>