<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Record a reusable 3D production receipt — procedure diagram</title><desc id="desc">One completed local candidate export and its measured file/dimension data. Reuse the existing batch receipt format and collect source revision, parameters and output hash. Record only actually measured timings, geometry counts and validation results. Link the receipt to the candidate and leave absent measurements explicitly unknown</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / LLMS, MCP &amp; PRODUCTION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Record a reusable 3D production receipt</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One completed local candidate export and its measured file/dimension</text><text x="36" y="191" font-size="18" fill="#bdb8d0">data</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Reuse the existing batch</text><text x="54" y="360" font-size="18" fill="#efedf6">receipt format and</text><text x="54" y="386" font-size="18" fill="#efedf6">collect source revision,</text><text x="54" y="412" font-size="18" fill="#efedf6">parameters and output</text><text x="54" y="438" font-size="18" fill="#efedf6">hash</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Record only actually</text><text x="356" y="360" font-size="18" fill="#efedf6">measured timings,</text><text x="356" y="386" font-size="18" fill="#efedf6">geometry counts and</text><text x="356" y="412" font-size="18" fill="#efedf6">validation results</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Link the receipt to the</text><text x="658" y="360" font-size="18" fill="#efedf6">candidate and leave</text><text x="658" y="386" font-size="18" fill="#efedf6">absent measurements</text><text x="658" y="412" font-size="18" fill="#efedf6">explicitly unknown</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>