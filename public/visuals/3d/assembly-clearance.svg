<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Show an assembly clearance envelope — procedure diagram</title><desc id="desc">Two generic mating parts and a 2 mm proposed clearance envelope. Preserve original part geometry and generate a visibly distinct clearance proxy. Move the insertion candidate along an explicit path and inspect sampled cross sections. Report geometric intersections and unresolved tolerance assumptions in a review table</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / ARCHITECTURE &amp; PRODUCTS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Show an assembly clearance envelope</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: Two generic mating parts and a 2 mm proposed clearance envelope</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Preserve original part</text><text x="54" y="360" font-size="18" fill="#efedf6">geometry and generate a</text><text x="54" y="386" font-size="18" fill="#efedf6">visibly distinct</text><text x="54" y="412" font-size="18" fill="#efedf6">clearance proxy</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Move the insertion</text><text x="356" y="360" font-size="18" fill="#efedf6">candidate along an</text><text x="356" y="386" font-size="18" fill="#efedf6">explicit path and inspect</text><text x="356" y="412" font-size="18" fill="#efedf6">sampled cross sections</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Report geometric</text><text x="658" y="360" font-size="18" fill="#efedf6">intersections and</text><text x="658" y="386" font-size="18" fill="#efedf6">unresolved tolerance</text><text x="658" y="412" font-size="18" fill="#efedf6">assumptions in a review</text><text x="658" y="438" font-size="18" fill="#efedf6">table</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>