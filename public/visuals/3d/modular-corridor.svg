<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Build a snapping corridor kit — procedure diagram</title><desc id="desc">Four 2 m wall modules, one corner and a 1 m doorway on a 0.25 m grid. Set all origins to a common floor corner and build the straight module with a bevel modifier. Derive the corner and doorway from the same thickness parameters; keep collision proxies separate. Assemble a 6 m corridor in the target engine using grid snapping; test from player height</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / GAME ASSETS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Build a snapping corridor kit</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: Four 2 m wall modules, one corner and a 1 m doorway on a 0.25 m grid</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Set all origins to a</text><text x="54" y="360" font-size="18" fill="#efedf6">common floor corner and</text><text x="54" y="386" font-size="18" fill="#efedf6">build the straight module</text><text x="54" y="412" font-size="18" fill="#efedf6">with a bevel modifier</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Derive the corner and</text><text x="356" y="360" font-size="18" fill="#efedf6">doorway from the same</text><text x="356" y="386" font-size="18" fill="#efedf6">thickness parameters;</text><text x="356" y="412" font-size="18" fill="#efedf6">keep collision proxies</text><text x="356" y="438" font-size="18" fill="#efedf6">separate</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Assemble a 6 m corridor</text><text x="658" y="360" font-size="18" fill="#efedf6">in the target engine</text><text x="658" y="386" font-size="18" fill="#efedf6">using grid snapping; test</text><text x="658" y="412" font-size="18" fill="#efedf6">from player height</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>