<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Keep provenance and rights attached to a 3D derivative — procedure diagram</title><desc id="desc">One approved source asset, its license text and a derived export. Inspect the owning registry for an equivalent source and preserve the original license/provenance record. Record transformations, external textures and model/source identities in the existing receipt. Review the final distribution bundle for attribution, restricted content and embedded private paths</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / LLMS, MCP &amp; PRODUCTION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Keep provenance and rights attached to a 3D derivative</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One approved source asset, its license text and a derived export</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Inspect the owning</text><text x="54" y="360" font-size="18" fill="#efedf6">registry for an</text><text x="54" y="386" font-size="18" fill="#efedf6">equivalent source and</text><text x="54" y="412" font-size="18" fill="#efedf6">preserve the original</text><text x="54" y="438" font-size="18" fill="#efedf6">license/provenance record</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Record transformations,</text><text x="356" y="360" font-size="18" fill="#efedf6">external textures and</text><text x="356" y="386" font-size="18" fill="#efedf6">model/source identities</text><text x="356" y="412" font-size="18" fill="#efedf6">in the existing receipt</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Review the final</text><text x="658" y="360" font-size="18" fill="#efedf6">distribution bundle for</text><text x="658" y="386" font-size="18" fill="#efedf6">attribution, restricted</text><text x="658" y="412" font-size="18" fill="#efedf6">content and embedded</text><text x="658" y="438" font-size="18" fill="#efedf6">private paths</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>