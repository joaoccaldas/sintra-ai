<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Build a star field from a cited catalog sample — procedure diagram</title><desc id="desc">A licensed catalog sample with RA, Dec, distance units and a stated epoch. Inspect column units, missing distances and the catalog&#x27;s coordinate frame/epoch. Use Astropy coordinates to transform only supported positions; retain missing values explicitly. Display points with separate brightness styling and a legend for distance scaling</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / SPACE &amp; SCIENTIFIC DATA</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Build a star field from a cited catalog sample</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A licensed catalog sample with RA, Dec, distance units and a stated</text><text x="36" y="191" font-size="18" fill="#bdb8d0">epoch</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Inspect column units,</text><text x="54" y="360" font-size="18" fill="#efedf6">missing distances and the</text><text x="54" y="386" font-size="18" fill="#efedf6">catalog&#x27;s coordinate</text><text x="54" y="412" font-size="18" fill="#efedf6">frame/epoch</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Use Astropy coordinates</text><text x="356" y="360" font-size="18" fill="#efedf6">to transform only</text><text x="356" y="386" font-size="18" fill="#efedf6">supported positions;</text><text x="356" y="412" font-size="18" fill="#efedf6">retain missing values</text><text x="356" y="438" font-size="18" fill="#efedf6">explicitly</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Display points with</text><text x="658" y="360" font-size="18" fill="#efedf6">separate brightness</text><text x="658" y="386" font-size="18" fill="#efedf6">styling and a legend for</text><text x="658" y="412" font-size="18" fill="#efedf6">distance scaling</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>