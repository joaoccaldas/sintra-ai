<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Make procedural variants reproducible — procedure diagram</title><desc id="desc">One existing generator, seeds 41/42/43 and a fixed parameter JSON. Record generator revision, Blender version and source dependencies. Pass each explicit seed into the existing random/placement controls. Regenerate one candidate and compare its exported identity and measured geometry under documented tolerances</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / LLMS, MCP &amp; PRODUCTION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Make procedural variants reproducible</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One existing generator, seeds 41/42/43 and a fixed parameter JSON</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Record generator</text><text x="54" y="360" font-size="18" fill="#efedf6">revision, Blender version</text><text x="54" y="386" font-size="18" fill="#efedf6">and source dependencies</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Pass each explicit seed</text><text x="356" y="360" font-size="18" fill="#efedf6">into the existing</text><text x="356" y="386" font-size="18" fill="#efedf6">random/placement controls</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Regenerate one candidate</text><text x="658" y="360" font-size="18" fill="#efedf6">and compare its exported</text><text x="658" y="386" font-size="18" fill="#efedf6">identity and measured</text><text x="658" y="412" font-size="18" fill="#efedf6">geometry under documented</text><text x="658" y="438" font-size="18" fill="#efedf6">tolerances</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>