<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Reuse one vegetation mesh across seasons — procedure diagram</title><desc id="desc">One approved tree, three leaf palettes and a winter visibility mask. Keep trunk geometry and semantic leaf groups stable across variants. Define spring, autumn and winter material/visibility parameters in one table. Compare each preset in the same scene and export only supported material changes</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / WORLDS &amp; ENVIRONMENTS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Reuse one vegetation mesh across seasons</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One approved tree, three leaf palettes and a winter visibility mask</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Keep trunk geometry and</text><text x="54" y="360" font-size="18" fill="#efedf6">semantic leaf groups</text><text x="54" y="386" font-size="18" fill="#efedf6">stable across variants</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Define spring, autumn and</text><text x="356" y="360" font-size="18" fill="#efedf6">winter</text><text x="356" y="386" font-size="18" fill="#efedf6">material/visibility</text><text x="356" y="412" font-size="18" fill="#efedf6">parameters in one table</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Compare each preset in</text><text x="658" y="360" font-size="18" fill="#efedf6">the same scene and export</text><text x="658" y="386" font-size="18" fill="#efedf6">only supported material</text><text x="658" y="412" font-size="18" fill="#efedf6">changes</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>