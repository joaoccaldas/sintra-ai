<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Compare an N-body orbit with a two-body reference — procedure diagram</title><desc id="desc">A synthetic star/planet pair in declared units, one orbital period and two time steps. Initialize a small REBOUND system with explicit masses and initial state. Integrate the same interval at two tolerances/time steps and save state plus energy diagnostics. Plot the trajectory first, then animate the saved positions without recalculating gravity in Blender</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / SPACE &amp; SCIENTIFIC DATA</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Compare an N-body orbit with a two-body reference</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A synthetic star/planet pair in declared units, one orbital period and</text><text x="36" y="191" font-size="18" fill="#bdb8d0">two time steps</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Initialize a small</text><text x="54" y="360" font-size="18" fill="#efedf6">REBOUND system with</text><text x="54" y="386" font-size="18" fill="#efedf6">explicit masses and</text><text x="54" y="412" font-size="18" fill="#efedf6">initial state</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Integrate the same</text><text x="356" y="360" font-size="18" fill="#efedf6">interval at two</text><text x="356" y="386" font-size="18" fill="#efedf6">tolerances/time steps and</text><text x="356" y="412" font-size="18" fill="#efedf6">save state plus energy</text><text x="356" y="438" font-size="18" fill="#efedf6">diagnostics</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Plot the trajectory</text><text x="658" y="360" font-size="18" fill="#efedf6">first, then animate the</text><text x="658" y="386" font-size="18" fill="#efedf6">saved positions without</text><text x="658" y="412" font-size="18" fill="#efedf6">recalculating gravity in</text><text x="658" y="438" font-size="18" fill="#efedf6">Blender</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>