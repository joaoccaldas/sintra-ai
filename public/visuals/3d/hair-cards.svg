<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Build a small hair-card style — procedure diagram</title><desc id="desc">A head proxy, six card strips and a licensed hair alpha atlas. Place broad cards to establish the silhouette before adding small strands. Map each strip to an atlas region and set a compatible alpha material. Inspect the style from front, side and rear under the target runtime&#x27;s sorting behavior</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / ANIMATION &amp; CHARACTERS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Build a small hair-card style</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A head proxy, six card strips and a licensed hair alpha atlas</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Place broad cards to</text><text x="54" y="360" font-size="18" fill="#efedf6">establish the silhouette</text><text x="54" y="386" font-size="18" fill="#efedf6">before adding small</text><text x="54" y="412" font-size="18" fill="#efedf6">strands</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Map each strip to an</text><text x="356" y="360" font-size="18" fill="#efedf6">atlas region and set a</text><text x="356" y="386" font-size="18" fill="#efedf6">compatible alpha material</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Inspect the style from</text><text x="658" y="360" font-size="18" fill="#efedf6">front, side and rear</text><text x="658" y="386" font-size="18" fill="#efedf6">under the target</text><text x="658" y="412" font-size="18" fill="#efedf6">runtime&#x27;s sorting</text><text x="658" y="438" font-size="18" fill="#efedf6">behavior</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>