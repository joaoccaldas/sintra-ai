<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Run a toy gripper contact experiment — procedure diagram</title><desc id="desc">A generic two-finger gripper, one box and three friction trials. Reuse a documented MuJoCo model and name the contact bodies explicitly. Run a bounded close-and-lift sequence with fixed initial conditions. Log contact forces, object slip and lift height before visualizing the replay</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / PHYSICS &amp; SIMULATION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Run a toy gripper contact experiment</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A generic two-finger gripper, one box and three friction trials</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Reuse a documented MuJoCo</text><text x="54" y="360" font-size="18" fill="#efedf6">model and name the</text><text x="54" y="386" font-size="18" fill="#efedf6">contact bodies explicitly</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Run a bounded close-and-</text><text x="356" y="360" font-size="18" fill="#efedf6">lift sequence with fixed</text><text x="356" y="386" font-size="18" fill="#efedf6">initial conditions</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Log contact forces,</text><text x="658" y="360" font-size="18" fill="#efedf6">object slip and lift</text><text x="658" y="386" font-size="18" fill="#efedf6">height before visualizing</text><text x="658" y="412" font-size="18" fill="#efedf6">the replay</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>