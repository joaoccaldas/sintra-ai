<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Retrieve one 3D procedure without loading the whole catalog — procedure diagram</title><desc id="desc">Sintra&#x27;s public compact knowledge index and an authorized HTTP-capable client. Read /api/index.json, then filter /api/knowledge-index.json by 3D and the task. Fetch the selected resourceUrl and follow its cited sources, execution status and limitations. Load the linked SKILL.md only when its procedure matches the requested environment; inspect tools separately</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / LLMS, MCP &amp; PRODUCTION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Retrieve one 3D procedure without loading the whole catalog</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: Sintra&#x27;s public compact knowledge index and an authorized HTTP-capable</text><text x="36" y="191" font-size="18" fill="#bdb8d0">client</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Read /api/index.json,</text><text x="54" y="360" font-size="18" fill="#efedf6">then filter</text><text x="54" y="386" font-size="18" fill="#efedf6">/api/knowledge-index.json</text><text x="54" y="412" font-size="18" fill="#efedf6">by 3D and the task</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Fetch the selected</text><text x="356" y="360" font-size="18" fill="#efedf6">resourceUrl and follow</text><text x="356" y="386" font-size="18" fill="#efedf6">its cited sources,</text><text x="356" y="412" font-size="18" fill="#efedf6">execution status and</text><text x="356" y="438" font-size="18" fill="#efedf6">limitations</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Load the linked SKILL.md</text><text x="658" y="360" font-size="18" fill="#efedf6">only when its procedure</text><text x="658" y="386" font-size="18" fill="#efedf6">matches the requested</text><text x="658" y="412" font-size="18" fill="#efedf6">environment; inspect</text><text x="658" y="438" font-size="18" fill="#efedf6">tools separately</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>