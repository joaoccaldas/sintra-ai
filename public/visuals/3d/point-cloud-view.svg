<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Display a bounded measured point cloud — procedure diagram</title><desc id="desc">A licensed 10000-point sample with XYZ units and optional color. Validate numeric values and center a display copy around a recorded local origin. Create a BufferGeometry/Points representation without inventing surface triangles. Add bounds, density controls and a text summary of sample size and units</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / WEB, XR &amp; INTERACTION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Display a bounded measured point cloud</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A licensed 10000-point sample with XYZ units and optional color</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Validate numeric values</text><text x="54" y="360" font-size="18" fill="#efedf6">and center a display copy</text><text x="54" y="386" font-size="18" fill="#efedf6">around a recorded local</text><text x="54" y="412" font-size="18" fill="#efedf6">origin</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Create a</text><text x="356" y="360" font-size="18" fill="#efedf6">BufferGeometry/Points</text><text x="356" y="386" font-size="18" fill="#efedf6">representation without</text><text x="356" y="412" font-size="18" fill="#efedf6">inventing surface</text><text x="356" y="438" font-size="18" fill="#efedf6">triangles</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Add bounds, density</text><text x="658" y="360" font-size="18" fill="#efedf6">controls and a text</text><text x="658" y="386" font-size="18" fill="#efedf6">summary of sample size</text><text x="658" y="412" font-size="18" fill="#efedf6">and units</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>