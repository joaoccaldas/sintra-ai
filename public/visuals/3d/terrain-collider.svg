<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Separate terrain visuals from collision — procedure diagram</title><desc id="desc">A 20 m terrain patch, a visible rocky edge and a low-resolution collision surface. Keep the render terrain unchanged and derive a named collider from a copy. Remove small visual overhangs from the collider while preserving walkable height. Import using the engine&#x27;s documented collision settings and walk the edge slowly</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / GAME ASSETS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Separate terrain visuals from collision</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A 20 m terrain patch, a visible rocky edge and a low-resolution</text><text x="36" y="191" font-size="18" fill="#bdb8d0">collision surface</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Keep the render terrain</text><text x="54" y="360" font-size="18" fill="#efedf6">unchanged and derive a</text><text x="54" y="386" font-size="18" fill="#efedf6">named collider from a</text><text x="54" y="412" font-size="18" fill="#efedf6">copy</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Remove small visual</text><text x="356" y="360" font-size="18" fill="#efedf6">overhangs from the</text><text x="356" y="386" font-size="18" fill="#efedf6">collider while preserving</text><text x="356" y="412" font-size="18" fill="#efedf6">walkable height</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Import using the engine&#x27;s</text><text x="658" y="360" font-size="18" fill="#efedf6">documented collision</text><text x="658" y="386" font-size="18" fill="#efedf6">settings and walk the</text><text x="658" y="412" font-size="18" fill="#efedf6">edge slowly</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>