<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Pair a radiance-field capture with collision geometry — procedure diagram</title><desc id="desc">One owned scene capture, a trained viewing representation and a coarse room proxy. Use the documented capture processing and training path on an authorized machine. Keep the capture as a visual representation and model a separate collision proxy. Align the two using three measured landmarks and inspect camera occlusion and navigation</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / MODELING &amp; RECONSTRUCTION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Pair a radiance-field capture with collision geometry</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One owned scene capture, a trained viewing representation and a coarse</text><text x="36" y="191" font-size="18" fill="#bdb8d0">room proxy</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Use the documented</text><text x="54" y="360" font-size="18" fill="#efedf6">capture processing and</text><text x="54" y="386" font-size="18" fill="#efedf6">training path on an</text><text x="54" y="412" font-size="18" fill="#efedf6">authorized machine</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Keep the capture as a</text><text x="356" y="360" font-size="18" fill="#efedf6">visual representation and</text><text x="356" y="386" font-size="18" fill="#efedf6">model a separate</text><text x="356" y="412" font-size="18" fill="#efedf6">collision proxy</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Align the two using three</text><text x="658" y="360" font-size="18" fill="#efedf6">measured landmarks and</text><text x="658" y="386" font-size="18" fill="#efedf6">inspect camera occlusion</text><text x="658" y="412" font-size="18" fill="#efedf6">and navigation</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>