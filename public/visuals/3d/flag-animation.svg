<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Create a wind-driven flag loop candidate — procedure diagram</title><desc id="desc">A 1 by 0.6 m flag, pinned pole edge and 120-frame trial. Subdivide a flat flag at a modest density and pin the pole-edge vertices. Add bounded wind and cloth collision; cache the trial on an authorized machine. Choose a segment with compatible endpoints or author a corrective blend before export</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / ANIMATION &amp; CHARACTERS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Create a wind-driven flag loop candidate</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A 1 by 0.6 m flag, pinned pole edge and 120-frame trial</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Subdivide a flat flag at</text><text x="54" y="360" font-size="18" fill="#efedf6">a modest density and pin</text><text x="54" y="386" font-size="18" fill="#efedf6">the pole-edge vertices</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Add bounded wind and</text><text x="356" y="360" font-size="18" fill="#efedf6">cloth collision; cache</text><text x="356" y="386" font-size="18" fill="#efedf6">the trial on an</text><text x="356" y="412" font-size="18" fill="#efedf6">authorized machine</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Choose a segment with</text><text x="658" y="360" font-size="18" fill="#efedf6">compatible endpoints or</text><text x="658" y="386" font-size="18" fill="#efedf6">author a corrective blend</text><text x="658" y="412" font-size="18" fill="#efedf6">before export</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>