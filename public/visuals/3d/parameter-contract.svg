<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Turn an LLM design brief into bounded parameters — procedure diagram</title><desc id="desc">A generic prop generator and width 0.4–0.8 m, height 0.3–0.6 m ranges. Inspect the existing generator and define a schema with units, bounds and required fields. Ask the LLM for parameters only; reject unknown keys and out-of-range values deterministically. Run one accepted parameter set through the existing generator and save the input/output identity</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / LLMS, MCP &amp; PRODUCTION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Turn an LLM design brief into bounded parameters</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A generic prop generator and width 0.4–0.8 m, height 0.3–0.6 m ranges</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Inspect the existing</text><text x="54" y="360" font-size="18" fill="#efedf6">generator and define a</text><text x="54" y="386" font-size="18" fill="#efedf6">schema with units, bounds</text><text x="54" y="412" font-size="18" fill="#efedf6">and required fields</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Ask the LLM for</text><text x="356" y="360" font-size="18" fill="#efedf6">parameters only; reject</text><text x="356" y="386" font-size="18" fill="#efedf6">unknown keys and out-of-</text><text x="356" y="412" font-size="18" fill="#efedf6">range values</text><text x="356" y="438" font-size="18" fill="#efedf6">deterministically</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Run one accepted</text><text x="658" y="360" font-size="18" fill="#efedf6">parameter set through the</text><text x="658" y="386" font-size="18" fill="#efedf6">existing generator and</text><text x="658" y="412" font-size="18" fill="#efedf6">save the input/output</text><text x="658" y="438" font-size="18" fill="#efedf6">identity</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>