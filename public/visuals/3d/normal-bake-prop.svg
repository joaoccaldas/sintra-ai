<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Bake a high-detail prop onto a game mesh — procedure diagram</title><desc id="desc">One high-detail panel, a low-detail panel, a non-overlapping UV map and a 1024 px normal target. Align high and low meshes; set the low mesh&#x27;s active image target. Bake selected-to-active tangent normals with a cage or bounded extrusion. Load the low mesh and normal texture in the target shader; compare under a moving light</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / GAME ASSETS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Bake a high-detail prop onto a game mesh</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One high-detail panel, a low-detail panel, a non-overlapping UV map and</text><text x="36" y="191" font-size="18" fill="#bdb8d0">a 1024 px normal target</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Align high and low</text><text x="54" y="360" font-size="18" fill="#efedf6">meshes; set the low</text><text x="54" y="386" font-size="18" fill="#efedf6">mesh&#x27;s active image</text><text x="54" y="412" font-size="18" fill="#efedf6">target</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Bake selected-to-active</text><text x="356" y="360" font-size="18" fill="#efedf6">tangent normals with a</text><text x="356" y="386" font-size="18" fill="#efedf6">cage or bounded extrusion</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Load the low mesh and</text><text x="658" y="360" font-size="18" fill="#efedf6">normal texture in the</text><text x="658" y="386" font-size="18" fill="#efedf6">target shader; compare</text><text x="658" y="412" font-size="18" fill="#efedf6">under a moving light</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>