<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Test a small rigid-body stack — procedure diagram</title><desc id="desc">Five 0.2 m cubes, a passive floor and a 120-frame trial. Apply scale and assign simple collision shapes with recorded mass values. Stack cubes with a small clear separation and run the low-cost cache. Compare settling with a smaller time step before accepting the visual motion</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / PHYSICS &amp; SIMULATION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Test a small rigid-body stack</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: Five 0.2 m cubes, a passive floor and a 120-frame trial</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Apply scale and assign</text><text x="54" y="360" font-size="18" fill="#efedf6">simple collision shapes</text><text x="54" y="386" font-size="18" fill="#efedf6">with recorded mass values</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Stack cubes with a small</text><text x="356" y="360" font-size="18" fill="#efedf6">clear separation and run</text><text x="356" y="386" font-size="18" fill="#efedf6">the low-cost cache</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Compare settling with a</text><text x="658" y="360" font-size="18" fill="#efedf6">smaller time step before</text><text x="658" y="386" font-size="18" fill="#efedf6">accepting the visual</text><text x="658" y="412" font-size="18" fill="#efedf6">motion</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>