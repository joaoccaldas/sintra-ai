<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Place a terrain tile on a geospatial globe — procedure diagram</title><desc id="desc">One licensed georeferenced terrain/model tile, CRS and height datum metadata. Inspect the tile&#x27;s origin, coordinate reference system and height reference. Use the selected geospatial tool&#x27;s supported import/tiling path with explicit georeferencing. Compare three known landmarks and record any vertical offset before adding a Blender-derived overlay</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / SPACE &amp; SCIENTIFIC DATA</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Place a terrain tile on a geospatial globe</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One licensed georeferenced terrain/model tile, CRS and height datum</text><text x="36" y="191" font-size="18" fill="#bdb8d0">metadata</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Inspect the tile&#x27;s</text><text x="54" y="360" font-size="18" fill="#efedf6">origin, coordinate</text><text x="54" y="386" font-size="18" fill="#efedf6">reference system and</text><text x="54" y="412" font-size="18" fill="#efedf6">height reference</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Use the selected</text><text x="356" y="360" font-size="18" fill="#efedf6">geospatial tool&#x27;s</text><text x="356" y="386" font-size="18" fill="#efedf6">supported import/tiling</text><text x="356" y="412" font-size="18" fill="#efedf6">path with explicit</text><text x="356" y="438" font-size="18" fill="#efedf6">georeferencing</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Compare three known</text><text x="658" y="360" font-size="18" fill="#efedf6">landmarks and record any</text><text x="658" y="386" font-size="18" fill="#efedf6">vertical offset before</text><text x="658" y="412" font-size="18" fill="#efedf6">adding a Blender-derived</text><text x="658" y="438" font-size="18" fill="#efedf6">overlay</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>