<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Make a small coherent rock family — procedure diagram</title><desc id="desc">One base boulder and five seeds with identical maximum dimensions. Reuse the base topology and vary a bounded displacement seed and intensity. Flatten the support patch without changing the approved maximum extent. Compare silhouettes under a single neutral material and export selected variants</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / WORLDS &amp; ENVIRONMENTS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Make a small coherent rock family</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One base boulder and five seeds with identical maximum dimensions</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Reuse the base topology</text><text x="54" y="360" font-size="18" fill="#efedf6">and vary a bounded</text><text x="54" y="386" font-size="18" fill="#efedf6">displacement seed and</text><text x="54" y="412" font-size="18" fill="#efedf6">intensity</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Flatten the support patch</text><text x="356" y="360" font-size="18" fill="#efedf6">without changing the</text><text x="356" y="386" font-size="18" fill="#efedf6">approved maximum extent</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Compare silhouettes under</text><text x="658" y="360" font-size="18" fill="#efedf6">a single neutral material</text><text x="658" y="386" font-size="18" fill="#efedf6">and export selected</text><text x="658" y="412" font-size="18" fill="#efedf6">variants</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>