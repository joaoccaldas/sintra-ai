<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Ship one mesh with reviewed finish variants — procedure diagram</title><desc id="desc">A single plinth mesh and two approved finish candidates. Keep one geometry source and record two material definitions with stable names. Use a supported variants export path or explicit application-side material mapping. Test switching in the actual viewer and compare file size against duplicated meshes</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / MATERIALS &amp; LIGHTING</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Ship one mesh with reviewed finish variants</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A single plinth mesh and two approved finish candidates</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Keep one geometry source</text><text x="54" y="360" font-size="18" fill="#efedf6">and record two material</text><text x="54" y="386" font-size="18" fill="#efedf6">definitions with stable</text><text x="54" y="412" font-size="18" fill="#efedf6">names</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Use a supported variants</text><text x="356" y="360" font-size="18" fill="#efedf6">export path or explicit</text><text x="356" y="386" font-size="18" fill="#efedf6">application-side material</text><text x="356" y="412" font-size="18" fill="#efedf6">mapping</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Test switching in the</text><text x="658" y="360" font-size="18" fill="#efedf6">actual viewer and compare</text><text x="658" y="386" font-size="18" fill="#efedf6">file size against</text><text x="658" y="412" font-size="18" fill="#efedf6">duplicated meshes</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>