<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Reconstruct a prop from overlapping photos — procedure diagram</title><desc id="desc">Thirty licensed photos of one stationary matte object and a scale marker. Inspect blur and overlap; mask background where it confuses feature matching. Use COLMAP&#x27;s feature extraction, matching and sparse reconstruction workflow. Review registered cameras before dense reconstruction and import a scaled candidate into Blender</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / MODELING &amp; RECONSTRUCTION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Reconstruct a prop from overlapping photos</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: Thirty licensed photos of one stationary matte object and a scale</text><text x="36" y="191" font-size="18" fill="#bdb8d0">marker</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Inspect blur and overlap;</text><text x="54" y="360" font-size="18" fill="#efedf6">mask background where it</text><text x="54" y="386" font-size="18" fill="#efedf6">confuses feature matching</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Use COLMAP&#x27;s feature</text><text x="356" y="360" font-size="18" fill="#efedf6">extraction, matching and</text><text x="356" y="386" font-size="18" fill="#efedf6">sparse reconstruction</text><text x="356" y="412" font-size="18" fill="#efedf6">workflow</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Review registered cameras</text><text x="658" y="360" font-size="18" fill="#efedf6">before dense</text><text x="658" y="386" font-size="18" fill="#efedf6">reconstruction and import</text><text x="658" y="412" font-size="18" fill="#efedf6">a scaled candidate into</text><text x="658" y="438" font-size="18" fill="#efedf6">Blender</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>