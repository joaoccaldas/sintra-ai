<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Drape fabric over a measured table — procedure diagram</title><desc id="desc">A 1.2 m cloth square, a 0.8 m table and pinned/no-pin trial variants. Apply scene scale and keep the table collision proxy simpler than the render mesh. Run a low-resolution cloth trial and inspect collision distance and self-intersections. Increase resolution only after the silhouette and support contact are acceptable</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / PHYSICS &amp; SIMULATION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Drape fabric over a measured table</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A 1.2 m cloth square, a 0.8 m table and pinned/no-pin trial variants</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Apply scene scale and</text><text x="54" y="360" font-size="18" fill="#efedf6">keep the table collision</text><text x="54" y="386" font-size="18" fill="#efedf6">proxy simpler than the</text><text x="54" y="412" font-size="18" fill="#efedf6">render mesh</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Run a low-resolution</text><text x="356" y="360" font-size="18" fill="#efedf6">cloth trial and inspect</text><text x="356" y="386" font-size="18" fill="#efedf6">collision distance and</text><text x="356" y="412" font-size="18" fill="#efedf6">self-intersections</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Increase resolution only</text><text x="658" y="360" font-size="18" fill="#efedf6">after the silhouette and</text><text x="658" y="386" font-size="18" fill="#efedf6">support contact are</text><text x="658" y="412" font-size="18" fill="#efedf6">acceptable</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>