<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Create a breakable crate with bounded debris — procedure diagram</title><desc id="desc">One intact 0.6 m crate and six hand-authored break pieces. Reuse the intact mesh and derive six named pieces with hidden interior faces closed. Give debris simple convex colliders and a short lifetime in a separate engine scene. Swap intact to debris on a single impact event; pool or remove debris after 3 seconds</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / GAME ASSETS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Create a breakable crate with bounded debris</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One intact 0.6 m crate and six hand-authored break pieces</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Reuse the intact mesh and</text><text x="54" y="360" font-size="18" fill="#efedf6">derive six named pieces</text><text x="54" y="386" font-size="18" fill="#efedf6">with hidden interior</text><text x="54" y="412" font-size="18" fill="#efedf6">faces closed</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Give debris simple convex</text><text x="356" y="360" font-size="18" fill="#efedf6">colliders and a short</text><text x="356" y="386" font-size="18" fill="#efedf6">lifetime in a separate</text><text x="356" y="412" font-size="18" fill="#efedf6">engine scene</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Swap intact to debris on</text><text x="658" y="360" font-size="18" fill="#efedf6">a single impact event;</text><text x="658" y="386" font-size="18" fill="#efedf6">pool or remove debris</text><text x="658" y="412" font-size="18" fill="#efedf6">after 3 seconds</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>