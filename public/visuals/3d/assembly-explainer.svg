<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Animate an assembly sequence with callouts — procedure diagram</title><desc id="desc">A four-part generic lamp and a 10-second storyboard. Define assembly order and collision-free paths for each semantic part. Keyframe parts into their original transforms with pauses for callouts. Review a low-cost viewport preview for legibility before using an authorized renderer</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / ANIMATION &amp; CHARACTERS</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Animate an assembly sequence with callouts</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A four-part generic lamp and a 10-second storyboard</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Define assembly order and</text><text x="54" y="360" font-size="18" fill="#efedf6">collision-free paths for</text><text x="54" y="386" font-size="18" fill="#efedf6">each semantic part</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Keyframe parts into their</text><text x="356" y="360" font-size="18" fill="#efedf6">original transforms with</text><text x="356" y="386" font-size="18" fill="#efedf6">pauses for callouts</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Review a low-cost</text><text x="658" y="360" font-size="18" fill="#efedf6">viewport preview for</text><text x="658" y="386" font-size="18" fill="#efedf6">legibility before using</text><text x="658" y="412" font-size="18" fill="#efedf6">an authorized renderer</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>