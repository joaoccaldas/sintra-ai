<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Attach durable annotations to model parts — procedure diagram</title><desc id="desc">Five semantic part IDs and authored explanatory text. Resolve existing semantic anchors instead of saving raw screen coordinates. Place labels with occlusion behavior and a synchronized accessible list. Test camera changes and a new finish variant without changing annotation identity</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / WEB, XR &amp; INTERACTION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Attach durable annotations to model parts</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: Five semantic part IDs and authored explanatory text</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Resolve existing semantic</text><text x="54" y="360" font-size="18" fill="#efedf6">anchors instead of saving</text><text x="54" y="386" font-size="18" fill="#efedf6">raw screen coordinates</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Place labels with</text><text x="356" y="360" font-size="18" fill="#efedf6">occlusion behavior and a</text><text x="356" y="386" font-size="18" fill="#efedf6">synchronized accessible</text><text x="356" y="412" font-size="18" fill="#efedf6">list</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Test camera changes and a</text><text x="658" y="360" font-size="18" fill="#efedf6">new finish variant</text><text x="658" y="386" font-size="18" fill="#efedf6">without changing</text><text x="658" y="412" font-size="18" fill="#efedf6">annotation identity</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>