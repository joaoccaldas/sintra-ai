<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Animate a synthetic exoplanet transit — procedure diagram</title><desc id="desc">A toy star of radius 1, planet radius 0.1 and a central transit path. Compute a clearly labelled simplified occultation series from an explicit geometric model. Animate the planet and plot relative flux against the same saved times. Compare full overlap against the toy depth approximation (Rp/Rs)^2 while labelling omitted limb darkening</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / SPACE &amp; SCIENTIFIC DATA</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Animate a synthetic exoplanet transit</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: A toy star of radius 1, planet radius 0.1 and a central transit path</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Compute a clearly</text><text x="54" y="360" font-size="18" fill="#efedf6">labelled simplified</text><text x="54" y="386" font-size="18" fill="#efedf6">occultation series from</text><text x="54" y="412" font-size="18" fill="#efedf6">an explicit geometric</text><text x="54" y="438" font-size="18" fill="#efedf6">model</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Animate the planet and</text><text x="356" y="360" font-size="18" fill="#efedf6">plot relative flux</text><text x="356" y="386" font-size="18" fill="#efedf6">against the same saved</text><text x="356" y="412" font-size="18" fill="#efedf6">times</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Compare full overlap</text><text x="658" y="360" font-size="18" fill="#efedf6">against the toy depth</text><text x="658" y="386" font-size="18" fill="#efedf6">approximation (Rp/Rs)^2</text><text x="658" y="412" font-size="18" fill="#efedf6">while labelling omitted</text><text x="658" y="438" font-size="18" fill="#efedf6">limb darkening</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>