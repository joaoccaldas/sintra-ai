<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Validate an export before engine handoff — procedure diagram</title><desc id="desc">One GLB, its source identity and the existing project&#x27;s Khronos validator. Export a derived candidate without overwriting the authoring source. Run the existing validator and retain errors, warnings and extension requirements. Import in the actual destination and inspect scale, materials, animation and required decoders</desc><rect width="960" height="640" rx="24" fill="#14131f"/><g font-family="system-ui,sans-serif"><text x="36" y="40" fill="#b9a7ff" font-size="16">SINTRA / LLMS, MCP &amp; PRODUCTION</text><text x="36" y="86" font-size="27" fill="#f2f0f8">Validate an export before engine handoff</text><text x="36" y="165" font-size="18" fill="#bdb8d0">Practice input: One GLB, its source identity and the existing project&#x27;s Khronos</text><text x="36" y="191" font-size="18" fill="#bdb8d0">validator</text><rect x="36" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="66" cy="290" r="16" fill="#b9a7ff"/><text x="61" y="296" fill="#14131f" font-size="17">1</text><text x="54" y="334" font-size="18" fill="#efedf6">Export a derived</text><text x="54" y="360" font-size="18" fill="#efedf6">candidate without</text><text x="54" y="386" font-size="18" fill="#efedf6">overwriting the authoring</text><text x="54" y="412" font-size="18" fill="#efedf6">source</text><path d="M321 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="338" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="368" cy="290" r="16" fill="#b9a7ff"/><text x="363" y="296" fill="#14131f" font-size="17">2</text><text x="356" y="334" font-size="18" fill="#efedf6">Run the existing</text><text x="356" y="360" font-size="18" fill="#efedf6">validator and retain</text><text x="356" y="386" font-size="18" fill="#efedf6">errors, warnings and</text><text x="356" y="412" font-size="18" fill="#efedf6">extension requirements</text><path d="M623 404h14m-5-5 5 5-5 5" fill="none" stroke="#8fe3d2" stroke-width="2"/><rect x="640" y="255" width="282" height="298" rx="14" fill="#201d31" stroke="#51446f"/><circle cx="670" cy="290" r="16" fill="#b9a7ff"/><text x="665" y="296" fill="#14131f" font-size="17">3</text><text x="658" y="334" font-size="18" fill="#efedf6">Import in the actual</text><text x="658" y="360" font-size="18" fill="#efedf6">destination and inspect</text><text x="658" y="386" font-size="18" fill="#efedf6">scale, materials,</text><text x="658" y="412" font-size="18" fill="#efedf6">animation and required</text><text x="658" y="438" font-size="18" fill="#efedf6">decoders</text><text x="36" y="595" font-size="17" fill="#8fe3d2">Inspect the result against the acceptance checks in the full guide.</text><text x="36" y="622" font-size="14" fill="#aaa2bb">Original learning diagram · illustrative · not a render or execution receipt</text></g></svg>