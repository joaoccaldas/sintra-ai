name: Sintra ond.ai Brand Preview

# Temporary isolated PR29 preview. Never replaces production landing.
on:
  push:
    branches:
      - feat/sintra-ond-brand-identity-20261023

permissions:
  contents: read

concurrency:
  group: sintra-ond-brand-preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'joaoccaldas/sintra-ai'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SINTRA_PREVIEW_BASE_PATH: /sintra-ai/preview/ond-brand
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate and export real static site
        run: npm run check
      - name: Verify path, branding and search exclusion
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q '/sintra-ai/preview/ond-brand/_next/' dist/index.html
          grep -qi 'noindex' dist/index.html
          grep -q 'Entenda a IA' dist/index.html
          grep -q 'ond.ai' dist/index.html
          echo 'Sintra ond.ai brand preview build validated'
      - name: Publish isolated preview directory only
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: preview/ond-brand
          keep_files: true
          commit_message: 'preview: Sintra ond.ai ${{ github.sha }}'
