name: Temporary Sintra PR27 Preview

# Deliberately scoped to a single reviewed feature branch. The existing
# 06:00 UTC production deploy replaces gh-pages and may remove this preview.
on:
  push:
    branches:
      - feat/sintra-mobile-first-home-20261023

permissions:
  contents: read

concurrency:
  group: sintra-pr27-pages-preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'joaoccaldas/sintra-ai'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SINTRA_PREVIEW_BASE_PATH: /sintra-ai/preview/pr-27
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete release check and isolated static export
        run: npm run check

      - name: Verify the preview is isolated and not indexed
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q '/sintra-ai/preview/pr-27/_next/' dist/index.html
          grep -qi 'noindex' dist/index.html
          grep -q 'IA que sai do\|AI you can put' dist/index.html
          echo 'Verified root-relative assets, metadata and homepage copy in preview artifact'

      - name: Publish preview subdirectory only
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: preview/pr-27
          keep_files: true
          commit_message: 'preview: Sintra PR27 ${{ github.sha }}'
